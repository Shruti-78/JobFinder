<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #b9c4fb, #d7b7f9);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 340px;
      text-align: center;
    }

    .card h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }

    .card input,
    .card select {
      width: 100%;
      padding: 0.75rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .card button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: #667eea;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .card button:hover {
      background: #5a67d8;
    }

    .login-text {
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .login-text a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: red;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sign Up</h2>
    <form action="/signup" method="POST">
      <input name="username" placeholder="Username" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <div class="login-text">
      Already have an account? <a href="/login.html">Login</a>
    </div>
    <div class="error-message" id="signup-error">Something went wrong. Please try again.</div>
  </div>

</body>
</html>
